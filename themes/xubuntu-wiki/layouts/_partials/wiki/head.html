<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{ or .Description .Summary site.Title | plainify | htmlUnescape | truncate 200 }}">
<meta name="color-scheme" content="light dark">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} ‹ {{ site.Title }}{{ end }}</title>
<link rel="icon" href="{{ site.Params.BookFavicon | default "favicon.png" | relURL }}">
<link rel="canonical" href="{{ .Permalink }}">
<script>
  // Apply the saved or system theme before first paint.
  (function () {
    var t = null;
    try { t = localStorage.getItem("wiki-theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") {
      t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
{{- $style := resources.Get "wiki.scss" | css.Sass | resources.Minify | resources.Fingerprint }}
<link rel="stylesheet" href="{{ $style.RelPermalink }}" integrity="{{ $style.Data.Integrity }}">
{{- $js := resources.Get "wiki.js" | js.Build (dict "minify" true) | resources.Fingerprint }}
<script defer src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}"></script>
{{- with .OutputFormats.Get "rss" }}
<link rel="alternate" type="application/rss+xml" href="{{ .RelPermalink }}" title="{{ site.Title }}">
{{- end }}
{{ partial "opengraph.html" . }}
